<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Cấu hình để biến thành Web App trên điện thoại -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Quên Đi Em POS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-main: #f0a500;
            --text-light: #fff;
            --border-color: #333;
            --btn-bg: #333;
            --btn-active: #f0a500;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-light); padding-bottom: 80px; user-select: none; }
        
        /* Màn hình Đăng nhập */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .login-box { background: #222; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--text-main); }
        .login-box h2 { color: var(--text-main); font-family: 'Brush Script MT', cursive; font-size: 32px; margin-bottom: 20px; }
        
        .header { text-align: center; padding: 15px; border-bottom: 2px solid var(--text-main); background: #000; position: sticky; top: 0; z-index: 10; }
        .header h1 { color: var(--text-main); font-size: 24px; font-family: 'Brush Script MT', cursive; letter-spacing: 2px; }
        .staff
